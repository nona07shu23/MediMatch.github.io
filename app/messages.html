<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>メッセージ - MediMatch</title>
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="app-style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
    
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <h1 class="header-title">メッセージ</h1>
            <button class="header-action-btn" onclick="toggleFilterModal()" aria-label="フィルター">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
            </button>
        </header>
        
        <!-- メインコンテンツ -->
        <main class="app-content" id="main-content">
            <!-- タブ -->
            <div class="mobile-tabs">
                <button class="mobile-tab active" onclick="showTab('all')">すべて <span class="nav-badge" style="position: static; margin-left: 4px;">5</span></button>
                <button class="mobile-tab" onclick="showTab('unread')">未読</button>
                <button class="mobile-tab" onclick="showTab('archived')">アーカイブ</button>
            </div>
            
            <!-- すべてのメッセージ -->
            <div id="allTab" class="tab-content">
                <div class="mb-md">
                    <span class="fw-semibold" id="allCount">5</span> 件のメッセージ
                </div>
                
                <div id="messageList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- 未読メッセージ -->
            <div id="unreadTab" class="tab-content" style="display: none;">
                <div class="mb-md">
                    <span class="fw-semibold" id="unreadCount">2</span> 件の未読メッセージ
                </div>
                
                <div id="unreadList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- アーカイブ -->
            <div id="archivedTab" class="tab-content" style="display: none;">
                <div class="mb-md">
                    <span class="fw-semibold">0</span> 件のアーカイブ
                </div>
                
                <div class="mobile-empty-state">
                    <svg class="mobile-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="21 8 21 21 3 21 3 8"></polyline>
                        <rect x="1" y="3" width="22" height="5"></rect>
                        <line x1="10" y1="12" x2="14" y2="12"></line>
                    </svg>
                    <div class="mobile-empty-title">アーカイブされたメッセージはありません</div>
                </div>
            </div>
        </main>
        
        <!-- ボトムナビゲーション -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>ホーム</span>
            </a>
            
            <a href="job-search.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span>求人検索</span>
            </a>
            
            <a href="scouts.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>スカウト</span>
                <span class="nav-badge">5</span>
            </a>
            
            <a href="messages.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>メッセージ</span>
                <span class="nav-badge">2</span>
            </a>
            
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>マイページ</span>
            </a>
        </nav>
    </div>
    
    <!-- フィルターモーダル -->
    <div id="filterModal" class="action-sheet-overlay" style="display: none;" onclick="toggleFilterModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: var(--spacing-lg);">メッセージフィルター</h3>
            
            <div class="form-group">
                <label class="form-label">ステータス</label>
                <select class="form-control">
                    <option>すべて</option>
                    <option>未読のみ</option>
                    <option>既読のみ</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">メッセージタイプ</label>
                <select class="form-control">
                    <option>すべて</option>
                    <option>応募関連</option>
                    <option>スカウト関連</option>
                    <option>面接調整</option>
                </select>
            </div>
            
            <div style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-lg);">
                <button class="btn btn-outline" style="flex: 1;" onclick="toggleFilterModal()">キャンセル</button>
                <button class="btn btn-primary" style="flex: 1;" onclick="applyFilter()">適用</button>
            </div>
        </div>
    </div>
    
    <script src="../common/demo-data.js"></script>
    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
        
        // デモ用メッセージデータ
        const messages = [
            {
                id: 1,
                facilityName: '東京メディカルセンター',
                lastMessage: '面接日程についてご相談させてください。来週の火曜日または水曜日はいかがでしょうか？',
                timestamp: '5分前',
                unreadCount: 2,
                isUnread: true,
                status: 'interview',
                avatar: '東'
            },
            {
                id: 2,
                facilityName: '横浜内科クリニック',
                lastMessage: 'ご応募ありがとうございます。履歴書を確認させていただきました。',
                timestamp: '1時間前',
                unreadCount: 1,
                isUnread: true,
                status: 'application',
                avatar: '横'
            },
            {
                id: 3,
                facilityName: 'ホームケアメディカル',
                lastMessage: '承知いたしました。それでは来週の月曜日10時にオンライン面談でお願いします。',
                timestamp: '昨日',
                unreadCount: 0,
                isUnread: false,
                status: 'interview',
                avatar: 'ホ'
            },
            {
                id: 4,
                facilityName: '東京健診クリニック',
                lastMessage: 'スカウトメッセージをお送りしました。ご確認ください。',
                timestamp: '2日前',
                unreadCount: 0,
                isUnread: false,
                status: 'scout',
                avatar: '東'
            },
            {
                id: 5,
                facilityName: 'シニアライフ湘南',
                lastMessage: 'ありがとうございました。契約書を送付いたしますので、ご確認ください。',
                timestamp: '1週間前',
                unreadCount: 0,
                isUnread: false,
                status: 'contract',
                avatar: 'シ'
            }
        ];
        
        // タブ切り替え
        function showTab(tabName) {
            // すべてのタブコンテンツを非表示
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            
            // すべてのタブボタンを非アクティブ化
            document.querySelectorAll('.mobile-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 選択されたタブを表示
            if (tabName === 'all') {
                document.getElementById('allTab').style.display = 'block';
                document.querySelectorAll('.mobile-tab')[0].classList.add('active');
            } else if (tabName === 'unread') {
                document.getElementById('unreadTab').style.display = 'block';
                document.querySelectorAll('.mobile-tab')[1].classList.add('active');
            } else if (tabName === 'archived') {
                document.getElementById('archivedTab').style.display = 'block';
                document.querySelectorAll('.mobile-tab')[2].classList.add('active');
            }
        }
        
        // メッセージリストを表示
        function displayMessages(messageList, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (messageList.length === 0) {
                container.innerHTML = `
                    <div class="mobile-empty-state">
                        <svg class="mobile-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <div class="mobile-empty-title">メッセージはありません</div>
                        <div class="mobile-empty-description">施設とのやり取りがここに表示されます</div>
                    </div>
                `;
                return;
            }
            
            messageList.forEach(msg => {
                const item = document.createElement('a');
                item.href = `message-thread.html?id=${msg.id}`;
                item.className = 'list-item';
                if (msg.isUnread) {
                    item.style.backgroundColor = 'var(--very-light-blue)';
                }
                
                const statusBadge = {
                    'application': '<span class="badge badge-primary">応募中</span>',
                    'scout': '<span class="badge badge-success">スカウト</span>',
                    'interview': '<span class="badge badge-warning">面接調整</span>',
                    'contract': '<span class="badge badge-gray">契約</span>'
                };
                
                item.innerHTML = `
                    <div class="list-item-icon" style="background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue)); color: white; font-size: var(--font-size-lg); font-weight: 600;">
                        ${msg.avatar}
                    </div>
                    <div class="list-item-content">
                        <div class="d-flex" style="justify-content: space-between; align-items: start; margin-bottom: var(--spacing-xs);">
                            <div class="list-item-title" style="flex: 1;">${msg.facilityName}</div>
                            <div class="text-muted" style="font-size: var(--font-size-xs); white-space: nowrap; margin-left: var(--spacing-sm);">${msg.timestamp}</div>
                        </div>
                        <div class="list-item-subtitle" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                            ${msg.lastMessage}
                        </div>
                        <div class="list-item-meta mt-xs">
                            ${statusBadge[msg.status]}
                            ${msg.unreadCount > 0 ? `<span class="badge" style="background: var(--error); color: white;">${msg.unreadCount}件の未読</span>` : ''}
                        </div>
                    </div>
                    <svg class="list-item-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                `;
                container.appendChild(item);
            });
        }
        
        // すべてのメッセージを表示
        function displayAllMessages() {
            displayMessages(messages, 'messageList');
            document.getElementById('allCount').textContent = messages.length;
        }
        
        // 未読メッセージを表示
        function displayUnreadMessages() {
            const unreadMessages = messages.filter(m => m.isUnread);
            displayMessages(unreadMessages, 'unreadList');
            document.getElementById('unreadCount').textContent = unreadMessages.length;
        }
        
        // フィルターモーダル開閉
        function toggleFilterModal() {
            const modal = document.getElementById('filterModal');
            modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
        }
        
        // フィルター適用
        function applyFilter() {
            // 実際のアプリでは、ここでフィルタリング処理を実行
            toggleFilterModal();
            alert('フィルターを適用しました');
        }
        
        // 初期化
        displayAllMessages();
        displayUnreadMessages();
    </script>
</body>
</html>
