<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>応募状況 - MediMatch</title>
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="app-style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
    
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <button class="header-back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                戻る
            </button>
            <h1 class="header-title">応募状況</h1>
            <button class="header-action-btn" onclick="toggleFilterModal()" aria-label="フィルター">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
            </button>
        </header>
        
        <!-- メインコンテンツ -->
        <main class="app-content" id="main-content">
            <!-- タブ -->
            <div class="mobile-tabs">
                <button class="mobile-tab active" onclick="showTab('all')">すべて <span class="nav-badge" style="position: static; margin-left: 4px;">5</span></button>
                <button class="mobile-tab" onclick="showTab('screening')">選考中</button>
                <button class="mobile-tab" onclick="showTab('interview')">面接予定</button>
                <button class="mobile-tab" onclick="showTab('completed')">完了</button>
            </div>
            
            <!-- すべての応募 -->
            <div id="allTab" class="tab-content">
                <div class="mb-md">
                    <span class="fw-semibold" id="allCount">5</span> 件の応募
                </div>
                
                <div id="applicationList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- 選考中 -->
            <div id="screeningTab" class="tab-content" style="display: none;">
                <div class="mb-md">
                    <span class="fw-semibold" id="screeningCount">2</span> 件の選考中
                </div>
                
                <div id="screeningList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- 面接予定 -->
            <div id="interviewTab" class="tab-content" style="display: none;">
                <div class="mb-md">
                    <span class="fw-semibold" id="interviewCount">2</span> 件の面接予定
                </div>
                
                <div id="interviewList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- 完了 -->
            <div id="completedTab" class="tab-content" style="display: none;">
                <div class="mb-md">
                    <span class="fw-semibold" id="completedCount">1</span> 件の完了
                </div>
                
                <div id="completedList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
        </main>
        
        <!-- ボトムナビゲーション -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>ホーム</span>
            </a>
            
            <a href="job-search.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span>求人検索</span>
            </a>
            
            <a href="scouts.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>スカウト</span>
                <span class="nav-badge">5</span>
            </a>
            
            <a href="messages.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>メッセージ</span>
                <span class="nav-badge">2</span>
            </a>
            
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>マイページ</span>
            </a>
        </nav>
    </div>
    
    <!-- フィルターモーダル -->
    <div id="filterModal" class="action-sheet-overlay" style="display: none;" onclick="toggleFilterModal()">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: var(--spacing-lg);">応募フィルター</h3>
            
            <div class="form-group">
                <label class="form-label">応募日</label>
                <select class="form-control">
                    <option>すべて</option>
                    <option>今週</option>
                    <option>今月</option>
                    <option>3ヶ月以内</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">雇用形態</label>
                <select class="form-control">
                    <option>すべて</option>
                    <option>常勤</option>
                    <option>非常勤</option>
                    <option>スポット</option>
                </select>
            </div>
            
            <div style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-lg);">
                <button class="btn btn-outline" style="flex: 1;" onclick="resetFilter()">リセット</button>
                <button class="btn btn-primary" style="flex: 1;" onclick="applyFilter()">適用</button>
            </div>
        </div>
    </div>
    
    <script src="../common/demo-data.js"></script>
    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
        
        // デモ用応募データ
        const applications = [
            {
                id: 1,
                facilityName: '東京メディカルセンター',
                jobTitle: '消化器内科医師（非常勤）',
                specialty: '消化器内科',
                employmentType: '非常勤',
                location: '東京都渋谷区',
                salary: '時給 15,000円',
                status: 'interview', // pending, screening, interview, offered, accepted, rejected
                statusLabel: '面接予定',
                appliedDate: '2026-01-05',
                interviewDate: '2026-01-20 14:00',
                nextAction: '面接準備',
                progress: 75
            },
            {
                id: 2,
                facilityName: '横浜内科クリニック',
                jobTitle: '一般内科医師（スポット）',
                specialty: '内科',
                employmentType: 'スポット',
                location: '神奈川県横浜市',
                salary: '日給 80,000円',
                status: 'screening',
                statusLabel: '書類選考中',
                appliedDate: '2026-01-08',
                interviewDate: null,
                nextAction: '結果待ち',
                progress: 25
            },
            {
                id: 3,
                facilityName: 'ホームケアメディカル',
                jobTitle: '在宅医療医師（非常勤）',
                specialty: '総合診療科',
                employmentType: '非常勤',
                location: '東京都世田谷区',
                salary: '時給 12,000円',
                status: 'interview',
                statusLabel: '面接調整中',
                appliedDate: '2026-01-03',
                interviewDate: '日程調整中',
                nextAction: '日程返信',
                progress: 50
            },
            {
                id: 4,
                facilityName: '東京健診クリニック',
                jobTitle: '健診医師（スポット）',
                specialty: '内科',
                employmentType: 'スポット',
                location: '東京都千代田区',
                salary: '日給 70,000円',
                status: 'accepted',
                statusLabel: '採用決定',
                appliedDate: '2025-12-20',
                interviewDate: null,
                nextAction: '契約手続き',
                progress: 100
            },
            {
                id: 5,
                facilityName: 'シニアライフ湘南',
                jobTitle: '施設医師（非常勤）',
                specialty: '内科',
                employmentType: '非常勤',
                location: '神奈川県藤沢市',
                salary: '時給 13,000円',
                status: 'screening',
                statusLabel: '書類選考中',
                appliedDate: '2026-01-10',
                interviewDate: null,
                nextAction: '結果待ち',
                progress: 25
            }
        ];
        
        // タブ切り替え
        function showTab(tabName) {
            // すべてのタブコンテンツを非表示
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            
            // すべてのタブボタンを非アクティブ化
            document.querySelectorAll('.mobile-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 選択されたタブを表示
            if (tabName === 'all') {
                document.getElementById('allTab').style.display = 'block';
                document.querySelectorAll('.mobile-tab')[0].classList.add('active');
            } else if (tabName === 'screening') {
                document.getElementById('screeningTab').style.display = 'block';
                document.querySelectorAll('.mobile-tab')[1].classList.add('active');
            } else if (tabName === 'interview') {
                document.getElementById('interviewTab').style.display = 'block';
                document.querySelectorAll('.mobile-tab')[2].classList.add('active');
            } else if (tabName === 'completed') {
                document.getElementById('completedTab').style.display = 'block';
                document.querySelectorAll('.mobile-tab')[3].classList.add('active');
            }
        }
        
        // 応募リストを表示
        function displayApplications(appList, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (appList.length === 0) {
                container.innerHTML = `
                    <div class="mobile-empty-state">
                        <svg class="mobile-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <div class="mobile-empty-title">応募はありません</div>
                        <div class="mobile-empty-description">興味のある求人に応募してみましょう</div>
                    </div>
                `;
                return;
            }
            
            appList.forEach(app => {
                const item = document.createElement('a');
                item.href = `application-detail.html?id=${app.id}`;
                item.className = 'list-item';
                
                const statusColors = {
                    'pending': 'var(--gray-400)',
                    'screening': 'var(--primary-blue)',
                    'interview': 'var(--warning)',
                    'offered': 'var(--success)',
                    'accepted': 'var(--success)',
                    'rejected': 'var(--error)'
                };
                
                const statusBgColors = {
                    'pending': 'var(--gray-100)',
                    'screening': 'var(--light-blue-bg)',
                    'interview': 'var(--warning-light)',
                    'offered': 'var(--success-light)',
                    'accepted': 'var(--success-light)',
                    'rejected': 'var(--error-light)'
                };
                
                item.innerHTML = `
                    <div class="list-item-icon" style="background: ${statusBgColors[app.status]}; color: ${statusColors[app.status]};">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                    </div>
                    <div class="list-item-content">
                        <div class="list-item-title">${app.jobTitle}</div>
                        <div class="list-item-subtitle">${app.facilityName} · ${app.location}</div>
                        <div class="list-item-meta">
                            <span class="badge badge-primary">${app.specialty}</span>
                            <span class="badge badge-gray">${app.employmentType}</span>
                            <span class="badge" style="background: ${statusBgColors[app.status]}; color: ${statusColors[app.status]};">${app.statusLabel}</span>
                        </div>
                        <div class="list-item-meta mt-xs">
                            <span class="text-primary fw-semibold">${app.salary}</span>
                            <span class="text-muted">·</span>
                            <span class="text-muted">応募: ${app.appliedDate}</span>
                        </div>
                        ${app.progress < 100 ? `
                            <div style="margin-top: var(--spacing-xs);">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                    <span style="font-size: var(--font-size-xs); color: var(--text-muted);">進捗状況</span>
                                    <span style="font-size: var(--font-size-xs); font-weight: 600; color: ${statusColors[app.status]};">${app.progress}%</span>
                                </div>
                                <div style="background: var(--gray-200); height: 4px; border-radius: 2px; overflow: hidden;">
                                    <div style="background: ${statusColors[app.status]}; height: 100%; width: ${app.progress}%; transition: width 0.3s;"></div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <svg class="list-item-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                `;
                container.appendChild(item);
            });
        }
        
        // すべての応募を表示
        function displayAllApplications() {
            displayApplications(applications, 'applicationList');
            document.getElementById('allCount').textContent = applications.length;
        }
        
        // 選考中の応募を表示
        function displayScreeningApplications() {
            const screeningApps = applications.filter(a => a.status === 'screening' || a.status === 'pending');
            displayApplications(screeningApps, 'screeningList');
            document.getElementById('screeningCount').textContent = screeningApps.length;
        }
        
        // 面接予定の応募を表示
        function displayInterviewApplications() {
            const interviewApps = applications.filter(a => a.status === 'interview');
            displayApplications(interviewApps, 'interviewList');
            document.getElementById('interviewCount').textContent = interviewApps.length;
        }
        
        // 完了した応募を表示
        function displayCompletedApplications() {
            const completedApps = applications.filter(a => a.status === 'accepted' || a.status === 'rejected');
            displayApplications(completedApps, 'completedList');
            document.getElementById('completedCount').textContent = completedApps.length;
        }
        
        // フィルターモーダル開閉
        function toggleFilterModal() {
            const modal = document.getElementById('filterModal');
            modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
        }
        
        // フィルターリセット
        function resetFilter() {
            toggleFilterModal();
            alert('フィルターをリセットしました');
        }
        
        // フィルター適用
        function applyFilter() {
            toggleFilterModal();
            alert('フィルターを適用しました');
        }
        
        // 初期化
        displayAllApplications();
        displayScreeningApplications();
        displayInterviewApplications();
        displayCompletedApplications();
    </script>
</body>
</html>
