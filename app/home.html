<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ホーム - MediMatch</title>
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="app-style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
    
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <h1 class="header-title">ホーム</h1>
            <button class="header-action-btn" aria-label="通知">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="nav-badge">3</span>
            </button>
        </header>
        
        <!-- メインコンテンツ -->
        <main class="app-content" id="main-content">
            <!-- プロフィールサマリー -->
            <div class="profile-header" style="margin: calc(var(--spacing-md) * -1) calc(var(--spacing-md) * -1) var(--spacing-md); border-radius: 0 0 var(--border-radius-xl) var(--border-radius-xl);">
                <div class="profile-avatar" id="userAvatar">山</div>
                <div class="profile-name" id="userName">山田太郎</div>
                <div class="profile-specialty">内科・消化器内科</div>
            </div>
            
            <!-- 統計カード -->
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">今月の活動</h2>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md);">
                    <div class="mobile-stat-card">
                        <div class="mobile-stat-info">
                            <div class="mobile-stat-label">応募中</div>
                            <div class="mobile-stat-value">3</div>
                        </div>
                        <div class="mobile-stat-icon" style="background-color: var(--light-blue-bg); color: var(--primary-blue);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="mobile-stat-card">
                        <div class="mobile-stat-info">
                            <div class="mobile-stat-label">スカウト</div>
                            <div class="mobile-stat-value">8</div>
                        </div>
                        <div class="mobile-stat-icon" style="background-color: var(--success-light); color: var(--success);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 新着スカウト -->
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">新着スカウト</h2>
                    <a href="scouts.html" class="section-action">すべて見る</a>
                </div>
                
                <div id="scoutList">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- おすすめ求人 -->
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">おすすめ求人</h2>
                    <a href="job-search.html" class="section-action">もっと見る</a>
                </div>
                
                <div id="recommendedJobs">
                    <!-- JavaScriptで動的に生成 -->
                </div>
            </div>
            
            <!-- クイックアクション -->
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">クイックアクション</h2>
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-sm);">
                    <button class="btn btn-outline" onclick="location.href='job-search.html'">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        求人検索
                    </button>
                    <button class="btn btn-outline" onclick="location.href='profile.html'">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        プロフィール
                    </button>
                    <button class="btn btn-outline" onclick="location.href='calendar.html'">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        カレンダー
                    </button>
                    <button class="btn btn-outline" onclick="location.href='applications.html'">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        応募状況
                    </button>
                </div>
            </div>
        </main>
        
        <!-- ボトムナビゲーション -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>ホーム</span>
            </a>
            
            <a href="job-search.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span>求人検索</span>
            </a>
            
            <a href="scouts.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>スカウト</span>
                <span class="nav-badge">8</span>
            </a>
            
            <a href="messages.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>メッセージ</span>
                <span class="nav-badge">2</span>
            </a>
            
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>マイページ</span>
            </a>
        </nav>
    </div>
    
    <script src="../common/demo-data.js"></script>
    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
        
        // ユーザー情報表示
        const userName = sessionStorage.getItem('userName') || 'ゲスト';
        document.getElementById('userName').textContent = userName;
        document.getElementById('userAvatar').textContent = userName.substring(0, 1);
        
        // スカウト一覧を表示（最新3件）
        function displayScouts() {
            const container = document.getElementById('scoutList');
            const recentJobs = DEMO_JOBS.slice(0, 3);
            
            recentJobs.forEach(job => {
                const item = document.createElement('a');
                item.href = 'scout-detail.html';
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="list-item-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <div class="list-item-content">
                        <div class="list-item-title">${job.facilityName}</div>
                        <div class="list-item-subtitle">${job.title}</div>
                        <div class="list-item-meta">
                            <span class="badge badge-primary">${job.specialty}</span>
                            <span class="badge badge-gray">${job.employmentType}</span>
                            <span class="text-muted">${formatSalary(job.salaryType, job.salaryMin, job.salaryMax)}</span>
                        </div>
                    </div>
                    <svg class="list-item-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                `;
                container.appendChild(item);
            });
        }
        
        // おすすめ求人を表示（最新3件）
        function displayRecommendedJobs() {
            const container = document.getElementById('recommendedJobs');
            const jobs = DEMO_JOBS.slice(3, 6);
            
            jobs.forEach(job => {
                const item = document.createElement('a');
                item.href = 'job-detail.html';
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="list-item-icon" style="background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue)); color: white;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </div>
                    <div class="list-item-content">
                        <div class="list-item-title">${job.title}</div>
                        <div class="list-item-subtitle">${job.facilityName} · ${job.location}</div>
                        <div class="list-item-meta">
                            <span class="badge badge-primary">${job.specialty}</span>
                            <span class="text-primary fw-medium">${formatSalary(job.salaryType, job.salaryMin, job.salaryMax)}</span>
                        </div>
                    </div>
                    <svg class="list-item-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                `;
                container.appendChild(item);
            });
        }
        
        // 初期化
        displayScouts();
        displayRecommendedJobs();
    </script>
</body>
</html>
