<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求人管理 - MediMatch 医療機関向け</title>
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="web-style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
    
    <div class="web-container">
        <!-- サイドバー（dashboard.htmlと同じ） -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo">
                    <div class="logo-icon">M</div>
                    <span class="logo-text">MediMatch</span>
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>ダッシュボード</span>
                </a>
                
                <a href="job-list.html" class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <path d="M20 8v6M23 11h-6"></path>
                    </svg>
                    <span>求人管理</span>
                </a>
                
                <a href="doctor-search.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span>医師検索</span>
                </a>
                
                <a href="applications.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>応募管理</span>
                </a>
                
                <a href="scouts.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span>スカウト管理</span>
                </a>
                
                <a href="messages.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>メッセージ</span>
                    <span class="badge badge-error" style="margin-left: auto;">3</span>
                </a>
                
                <a href="settings.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span>設定</span>
                </a>
            </nav>
        </aside>
        
        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- ヘッダー -->
            <header class="top-header">
                <div class="header-left">
                    <button class="btn btn-outline btn-sm" id="menuToggle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h1 class="page-title">求人管理</h1>
                </div>
                
                <div class="header-right">
                    <div class="notification-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-badge">5</span>
                    </div>
                    
                    <div class="user-menu">
                        <div class="user-menu-button">
                            <div class="user-avatar">東</div>
                            <span id="userName">東京総合病院</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-menu-header">
                                <div class="dropdown-menu-user-name">東京総合病院</div>
                                <div class="dropdown-menu-user-email">facility@demo.medimatch.jp</div>
                            </div>
                            <div class="dropdown-menu-body">
                                <a href="settings.html" class="dropdown-menu-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                    <span>アカウント設定</span>
                                </a>
                                <a href="settings.html" class="dropdown-menu-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path d="M12 1v6m0 6v6m5.196-11.196l-4.243 4.243M7.757 16.243l-4.243 4.243m11.314-4.243l4.243 4.243M7.757 7.757l-4.243-4.243"></path>
                                    </svg>
                                    <span>設定</span>
                                </a>
                                <div class="dropdown-menu-divider"></div>
                                <a href="#" class="dropdown-menu-item danger" onclick="event.preventDefault(); signOut();">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                        <polyline points="16 17 21 12 16 7"></polyline>
                                        <line x1="21" y1="12" x2="9" y2="12"></line>
                                    </svg>
                                    <span>サインアウト</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- コンテンツエリア -->
            <div class="content-area" id="main-content">
                <div class="content-header">
                    <div class="breadcrumb">
                        <a href="dashboard.html">ホーム</a>
                        <span class="breadcrumb-separator">›</span>
                        <span>求人管理</span>
                    </div>
                    
                    <div class="content-header-top">
                        <div>
                            <h2 class="mb-xs">求人管理</h2>
                            <p class="text-muted mb-0">求人票の作成・管理ができます</p>
                        </div>
                        <button class="btn btn-primary" onclick="location.href='job-create.html'">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            新規求人作成
                        </button>
                    </div>
                </div>
                
                <!-- タブ -->
                <div class="tabs">
                    <a href="#" class="tab active" data-tab="all">すべて</a>
                    <a href="#" class="tab" data-tab="published">公開中</a>
                    <a href="#" class="tab" data-tab="draft">下書き</a>
                    <a href="#" class="tab" data-tab="closed">募集終了</a>
                </div>
                
                <!-- フィルター -->
                <div class="search-filters">
                    <div class="filter-row">
                        <div class="search-box">
                            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <input type="text" class="form-control" placeholder="求人タイトルで検索" id="searchInput">
                        </div>
                        
                        <select class="form-control" id="specialtyFilter">
                            <option value="">すべての診療科</option>
                            <option value="内科">内科</option>
                            <option value="外科">外科</option>
                            <option value="整形外科">整形外科</option>
                            <option value="小児科">小児科</option>
                            <option value="産婦人科">産婦人科</option>
                        </select>
                        
                        <select class="form-control" id="employmentTypeFilter">
                            <option value="">すべての雇用形態</option>
                            <option value="常勤">常勤</option>
                            <option value="非常勤">非常勤</option>
                            <option value="スポット">スポット</option>
                        </select>
                        
                        <button class="btn btn-outline" onclick="resetFilters()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="1 4 1 10 7 10"></polyline>
                                <polyline points="23 20 23 14 17 14"></polyline>
                                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                            </svg>
                            リセット
                        </button>
                    </div>
                </div>
                
                <!-- 求人一覧テーブル -->
                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th style="width: 40%;">求人情報</th>
                                    <th>診療科</th>
                                    <th>雇用形態</th>
                                    <th>給与</th>
                                    <th>閲覧数</th>
                                    <th>応募数</th>
                                    <th>ステータス</th>
                                    <th style="width: 160px;">アクション</th>
                                </tr>
                            </thead>
                            <tbody id="jobList">
                                <!-- JavaScriptで動的に生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- ページネーション -->
                <div class="pagination">
                    <button class="pagination-btn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button class="pagination-btn active">1</button>
                    <button class="pagination-btn">2</button>
                    <button class="pagination-btn">3</button>
                    <button class="pagination-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../common/demo-data.js"></script>
    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
        
        const userName = sessionStorage.getItem('userName');
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }
        
        // メニュートグル
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });
        
        // 求人一覧を表示
        function displayJobs() {
            const tbody = document.getElementById('jobList');
            tbody.innerHTML = '';
            
            DEMO_JOBS.forEach(job => {
                const statusClass = job.status === 'published' ? 'badge-success' : 'badge-gray';
                const statusText = job.status === 'published' ? '公開中' : '下書き';
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="fw-semibold mb-xs">${job.title}</div>
                        <div class="text-muted" style="font-size: var(--font-size-sm);">
                            ${job.facilityName} · ${job.location}
                        </div>
                        <div class="text-muted" style="font-size: var(--font-size-sm);">
                            掲載日: ${formatDate(job.postedDate)}
                        </div>
                    </td>
                    <td>${job.specialty}</td>
                    <td><span class="badge badge-gray">${job.employmentType}</span></td>
                    <td>
                        <div style="font-size: var(--font-size-sm);">
                            ${formatSalary(job.salaryType, job.salaryMin, job.salaryMax)}
                        </div>
                    </td>
                    <td class="text-center">${job.views}</td>
                    <td class="text-center fw-semibold text-primary">${job.applications}</td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="d-flex gap-sm">
                            <button class="btn btn-sm btn-outline" onclick="location.href='job-edit.html'" title="編集">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>
                            <button class="btn btn-sm btn-outline" onclick="alert('詳細画面へ（未実装）')" title="詳細">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        // フィルターリセット
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('specialtyFilter').value = '';
            document.getElementById('employmentTypeFilter').value = '';
            displayJobs();
        }
        
        // タブ切り替え
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const tabType = this.dataset.tab;
                // ここでフィルタリングロジックを実装
                displayJobs();
            });
        });
        
        // 初期化
        displayJobs();
    </script>
</body>
</html>
