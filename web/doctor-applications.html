    <style>
        .filter-bar {
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .filter-group label {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }
        
        .tabs {
            display: flex;
            gap: var(--spacing-xs);
            border-bottom: 2px solid var(--border-color);
            margin-bottom: var(--spacing-lg);
            overflow-x: auto;
        }
        
        .tab {
            padding: var(--spacing-md) var(--spacing-lg);
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: var(--font-size-base);
            color: var(--text-secondary);
            white-space: nowrap;
            transition: all 0.2s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .tab:hover {
            color: var(--primary-blue);
            background-color: var(--gray-50);
        }
        
        .tab.active {
            color: var(--primary-blue);
            border-bottom-color: var(--primary-blue);
        }
        
        .tab .count {
            background-color: var(--gray-200);
            color: var(--text-primary);
            padding: 2px 8px;
            border-radius: var(--border-radius-full);
            font-size: var(--font-size-xs);
            font-weight: 600;
        }
        
        .tab.active .count {
            background-color: var(--primary-blue);
            color: white;
        }
        
        .application-card {
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .application-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-blue);
        }
        
        .application-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
            gap: var(--spacing-md);
        }
        
        .application-facility-info {
            flex: 1;
        }
        
        .application-facility-name {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            color: var(--primary-blue);
        }
        
        .application-job-title {
            font-size: var(--font-size-lg);
            font-weight: 500;
            margin-bottom: var(--spacing-sm);
        }
        
        .application-job-meta {
            display: flex;
            gap: var(--spacing-md);
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        
        .application-status-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--spacing-sm);
        }
        
        .application-date {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }
        
        .application-body {
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }
        
        .application-progress {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }
        
        .progress-step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .progress-step::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            width: 100%;
            height: 2px;
            background-color: var(--gray-200);
            z-index: -1;
        }
        
        .progress-step:last-child::after {
            display: none;
        }
        
        .progress-step.completed::after {
            background-color: var(--success);
        }
        
        .progress-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--gray-200);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-xs);
            font-size: 20px;
        }
        
        .progress-step.completed .progress-icon {
            background-color: var(--success);
            color: white;
        }
        
        .progress-step.current .progress-icon {
            background-color: var(--primary-blue);
            color: white;
        }
        
        .progress-label {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            text-align: center;
        }
        
        .progress-step.completed .progress-label,
        .progress-step.current .progress-label {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .application-message {
            background-color: var(--info-light);
            border-left: 4px solid var(--info);
            padding: var(--spacing-md);
            border-radius: var(--border-radius-md);
            font-size: var(--font-size-sm);
            line-height: 1.6;
            margin-bottom: var(--spacing-md);
        }
        
        .application-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .stat-card {
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            text-align: center;
        }
        
        .stat-value {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: var(--spacing-xs);
        }
        
        .stat-label {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }
        
        .empty-state {
            text-align: center;
            padding: var(--spacing-4xl) var(--spacing-xl);
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: var(--spacing-lg);
            opacity: 0.3;
        }
        
        .empty-state-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        .empty-state-text {
            color: var(--text-muted);
            margin-bottom: var(--spacing-lg);
        }
        
        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .application-card-header {
                flex-direction: column;
            }
            
            .application-status-section {
                align-items: flex-start;
            }
            
            .application-actions {
                flex-direction: column;
            }
            
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .application-progress {
                flex-direction: column;
                align-items: stretch;
            }
            
            .progress-step::after {
                display: none;
            }
        }
    </style>
</head>

    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
        
        const userName = sessionStorage.getItem('userName');
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }
        
        // メニュートグル
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });
        
        // 応募データの生成
        const applications = [];
        const statuses = [
            { value: 'screening', label: '書類選考中', class: 'info', step: 1 },
            { value: 'interview', label: '面接予定', class: 'primary', step: 2 },
            { value: 'offer', label: '内定', class: 'success', step: 3 },
            { value: 'rejected', label: '不採用', class: 'gray', step: 0 }
        ];
        
        // デモ応募データを生成（12件）
        const statusDistribution = [
            ...Array(5).fill('screening'),
            ...Array(2).fill('interview'),
            ...Array(1).fill('offer'),
            ...Array(4).fill('rejected')
        ];
        
        const facilities = [
            '東京総合病院', '聖マリア医療センター', '都立中央病院',
            '横浜記念病院', '千葉県立病院', '埼玉医科大学病院',
            '慶応義塾大学病院', '順天堂大学病院', '日本医科大学病院',
            '東京医科歯科大学病院', '昭和大学病院', '杏林大学病院'
        ];
        
        DEMO_JOBS.slice(0, 12).forEach((job, index) => {
            const daysAgo = index * 3; // 応募日（何日前）
            const applicationDate = new Date();
            applicationDate.setDate(applicationDate.getDate() - daysAgo);
            
            applications.push({
                id: index + 1,
                job: job,
                facility: facilities[index],
                status: statusDistribution[index] || 'screening',
                appliedDate: applicationDate,
                hasMessage: index % 3 === 0
            });
        });
        
        let currentStatusFilter = 'all';
        
        // 応募一覧の表示
        function displayApplications(filteredApplications = applications) {
            const container = document.getElementById('applicationsList');
            container.innerHTML = '';
            
            if (filteredApplications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-title">応募がありません</div>
                        <div class="empty-state-text">条件に一致する応募が見つかりませんでした。</div>
                        <button class="btn btn-primary" onclick="location.href='doctor-job-search.html'">
                            求人を探す
                        </button>
                    </div>
                `;
                return;
            }
            
            filteredApplications.forEach(app => {
                const statusInfo = statuses.find(s => s.value === app.status);
                const card = document.createElement('div');
                card.className = 'application-card';
                card.onclick = () => viewApplicationDetail(app.id);
                
                // 進捗ステップの表示
                const progressHTML = app.status !== 'rejected' ? `
                    <div class="application-progress">
                        <div class="progress-step ${statusInfo.step >= 1 ? 'completed' : ''} ${statusInfo.step === 1 ? 'current' : ''}">
                            <div class="progress-icon">📋</div>
                            <div class="progress-label">書類選考</div>
                        </div>
                        <div class="progress-step ${statusInfo.step >= 2 ? 'completed' : ''} ${statusInfo.step === 2 ? 'current' : ''}">
                            <div class="progress-icon">📅</div>
                            <div class="progress-label">面接</div>
                        </div>
                        <div class="progress-step ${statusInfo.step >= 3 ? 'completed' : ''} ${statusInfo.step === 3 ? 'current' : ''}">
                            <div class="progress-icon">✅</div>
                            <div class="progress-label">内定</div>
                        </div>
                    </div>
                ` : '';
                
                const messageHTML = app.hasMessage ? `
                    <div class="application-message">
                        💬 施設からメッセージがあります。面接日程についてご相談させていただきたく存じます。
                    </div>
                ` : '';
                
                card.innerHTML = `
                    <div class="application-card-header">
                        <div class="application-facility-info">
                            <div class="application-facility-name">${app.facility}</div>
                            <div class="application-job-title">${app.job.title}</div>
                            <div class="application-job-meta">
                                <span>${app.job.specialty}</span>
                                <span>•</span>
                                <span>${app.job.employmentType}</span>
                                <span>•</span>
                                <span>${app.job.location}</span>
                                <span>•</span>
                                <span>${formatSalary(app.job)}</span>
                            </div>
                        </div>
                        <div class="application-status-section">
                            <span class="badge badge-${statusInfo.class}">${statusInfo.label}</span>
                            <div class="application-date">${formatDate(app.appliedDate)}</div>
                        </div>
                    </div>
                    <div class="application-body">
                        ${progressHTML}
                        ${messageHTML}
                        <div class="application-actions" onclick="event.stopPropagation()">
                            ${app.hasMessage ? `
                                <button class="btn btn-primary btn-sm" onclick="viewMessage(${app.id})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                    </svg>
                                    メッセージを見る
                                </button>
                            ` : ''}
                            <button class="btn btn-outline btn-sm" onclick="viewJobDetail(${app.job.id})">
                                求人詳細
                            </button>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        // ステータス別フィルター
        function filterByStatus(status) {
            currentStatusFilter = status;
            
            // タブのアクティブ状態を更新
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.tab').classList.add('active');
            
            applyFilters();
        }
        
        // フィルター適用
        function applyFilters() {
            let filtered = [...applications];
            
            // ステータスフィルター
            if (currentStatusFilter !== 'all') {
                filtered = filtered.filter(app => app.status === currentStatusFilter);
            }
            
            // 検索フィルター
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(app => 
                    app.facility.toLowerCase().includes(searchQuery) ||
                    app.job.title.toLowerCase().includes(searchQuery)
                );
            }
            
            // 並び替え
            const sortBy = document.getElementById('sortFilter').value;
            switch (sortBy) {
                case 'date-desc':
                    filtered.sort((a, b) => b.appliedDate - a.appliedDate);
                    break;
                case 'date-asc':
                    filtered.sort((a, b) => a.appliedDate - b.appliedDate);
                    break;
                case 'facility-asc':
                    filtered.sort((a, b) => a.facility.localeCompare(b.facility));
                    break;
            }
            
            displayApplications(filtered);
        }
        
        // カウント更新
        function updateCounts() {
            document.getElementById('countAll').textContent = applications.length;
            document.getElementById('countScreening').textContent = applications.filter(a => a.status === 'screening').length;
            document.getElementById('countInterview').textContent = applications.filter(a => a.status === 'interview').length;
            document.getElementById('countOffer').textContent = applications.filter(a => a.status === 'offer').length;
            document.getElementById('countRejected').textContent = applications.filter(a => a.status === 'rejected').length;
        }
        
        // 応募詳細表示
        function viewApplicationDetail(appId) {
            window.location.href = 'doctor-application-detail.html';
        }
        
        // メッセージ表示
        function viewMessage(appId) {
            alert(`メッセージ画面へ遷移します（応募ID: ${appId}）`);
        }
        
        // 求人詳細表示
        function viewJobDetail(jobId) {
            window.location.href = 'doctor-job-detail.html';
        }
        
        // 初期化
        updateCounts();
        displayApplications();
    </script>
</body>
</html>
