<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ - MediMatch 医師向け</title>
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="web-style.css">
    <style>
        .messages-container {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: var(--spacing-lg);
            height: calc(100vh - 200px);
        }
        
        .messages-sidebar {
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .messages-sidebar-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }
        
        .messages-sidebar-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }
        
        .messages-tabs {
            display: flex;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
        }
        
        .messages-tab {
            flex: 1;
            padding: var(--spacing-sm) var(--spacing-md);
            background: none;
            border: none;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
        }
        
        .messages-tab:hover {
            background-color: var(--gray-50);
            color: var(--primary-blue);
        }
        
        .messages-tab.active {
            background-color: var(--primary-blue);
            color: white;
        }
        
        .messages-tab .count {
            background-color: rgba(255, 255, 255, 0.3);
            padding: 2px 6px;
            border-radius: var(--border-radius-full);
            font-size: var(--font-size-xs);
        }
        
        .messages-search {
            position: relative;
        }
        
        .messages-search input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-sm) var(--spacing-sm) 36px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            font-size: var(--font-size-sm);
        }
        
        .messages-search svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .messages-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .message-item {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            gap: var(--spacing-md);
        }
        
        .message-item:hover {
            background-color: var(--gray-50);
        }
        
        .message-item.active {
            background-color: #f0f7ff;
            border-left: 4px solid var(--primary-blue);
        }
        
        .message-item.unread {
            background-color: #f0f7ff;
        }
        
        .message-item.unread .message-item-subject {
            font-weight: 600;
        }
        
        .message-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-full);
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: var(--font-size-lg);
            flex-shrink: 0;
        }
        
        .message-item-content {
            flex: 1;
            min-width: 0;
        }
        
        .message-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-xs);
            gap: var(--spacing-sm);
        }
        
        .message-item-facility {
            font-weight: 600;
            font-size: var(--font-size-base);
            color: var(--text-primary);
        }
        
        .message-item-time {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            white-space: nowrap;
        }
        
        .message-item-subject {
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .message-item-preview {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .message-item-meta {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-xs);
        }
        
        .messages-main {
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-4xl);
        }
        
        .empty-state {
            text-align: center;
            max-width: 400px;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: var(--spacing-lg);
            opacity: 0.3;
        }
        
        .empty-state-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        .empty-state-text {
            color: var(--text-muted);
            margin-bottom: var(--spacing-lg);
        }
        
        .unread-indicator {
            width: 8px;
            height: 8px;
            background-color: var(--primary-blue);
            border-radius: 50%;
            margin-left: auto;
        }
        
        @media (max-width: 1024px) {
            .messages-container {
                grid-template-columns: 1fr;
            }
            
            .messages-main {
                display: none;
            }
        }
    </style>
</head>
<body>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- ヘッダー -->
            <header class="top-header">
                <div class="header-left">
                    <button class="btn btn-outline btn-sm" id="menuToggle">

                    </button>

                </div>
                
                <div class="header-right">
                    <div class="notification-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                        </svg>
                        <span class="notification-badge">5</span>
                    </div>
                    
                    <div class="user-menu">
                        <div class="user-menu-button">
                            <div class="user-avatar">山</div>

                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            </svg>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-menu-header">
                                <div class="dropdown-menu-user-name">山田太郎医師</div>
                                <div class="dropdown-menu-user-email">doctor@demo.medimatch.jp</div>
                            </div>
                            <div class="dropdown-menu-body">
                                <a href="settings.html" class="dropdown-menu-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>

                                        <circle cx="12" cy="12" r="3"></circle>

                    <div class="breadcrumb">
                        <a href="doctor-home.html">ホーム</a>
                        <span class="breadcrumb-separator">›</span>
                        <span>メッセージ</span>
                    </div>
                </div>
                
                <!-- メッセージコンテナ -->
                <div class="messages-container">
                    <!-- メッセージサイドバー -->
                    <div class="messages-sidebar">
                        <div class="messages-sidebar-header">
                            <div class="messages-sidebar-title">メッセージ</div>
                            
                            <div class="messages-tabs">
                                <button class="messages-tab active" onclick="filterMessages('all')">
                                    すべて
                                    <span class="count" id="countAll">12</span>
                                </button>
                                <button class="messages-tab" onclick="filterMessages('unread')">
                                    未読
                                    <span class="count" id="countUnread">4</span>
                                </button>
                            </div>
                            
                            <div class="messages-search">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                                <input 
                                    type="text" 
                                    placeholder="メッセージを検索"
                                    id="searchInput"
                                    oninput="searchMessages()"
                                >
                            </div>
                        </div>
                        
                        <div class="messages-list" id="messagesList">
                            <!-- JavaScriptで動的に生成 -->
                        </div>
                    </div>
                    
                    <!-- メッセージメイン -->
                    <div class="messages-main">
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div class="empty-state-title">メッセージを選択してください</div>
                            <div class="empty-state-text">左側のリストからメッセージを選択すると、ここに会話が表示されます。</div>
                        </div>
                    </div>
                </div>

    <script src="../common/demo-data.js"></script>
    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
        
        const userName = sessionStorage.getItem('userName');
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }
        
        // メニュートグル
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });
        
        // 時間表示のヘルパー関数
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'たった今';
            if (diffMins < 60) return `${diffMins}分前`;
            if (diffHours < 24) return `${diffHours}時間前`;
            if (diffDays === 1) return '昨日';
            if (diffDays < 7) return `${diffDays}日前`;
            return date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });
        }
        
        // メッセージデータの生成
        const messages = [];
        
        const facilities = [
            '東京総合病院', '聖マリア医療センター', '都立中央病院',
            '横浜記念病院', '千葉県立病院', '埼玉医科大学病院',
            '慶応義塾大学病院', '順天堂大学病院', '日本医科大学病院',
            '東京医科歯科大学病院', '昭和大学病院', '杏林大学病院'
        ];
        
        const subjects = [
            '応募書類受領のご連絡',
            '面接日程のご相談',
            '【重要】書類選考結果のご連絡',
            '面接日程確定のご連絡',
            '採用条件のご提示',
            '【お願い】追加書類のご提出について',
            '面接のフィードバックについて',
            '勤務開始日のご相談',
            '入職手続きのご案内',
            '見学のご案内',
            '求人に関するご質問への回答',
            'スカウトへの返信について'
        ];
        
        const previews = [
            'この度は当院の求人にご応募いただき、誠にありがとうございます...',
            '書類選考の結果、ぜひ先生と面接させていただきたく...',
            '面接日程につきまして、以下の候補日からお選びいただけますでしょうか...',
            '先日の面接、ありがとうございました。採用条件について...',
            'お忙しいところ恐れ入ります。履歴書に関して確認したい点が...',
            '面接日程を2024年3月15日（金）14:00で確定いたしました...',
            '当院での勤務にご興味をお持ちいただき、ありがとうございます...',
            '採用条件の詳細についてご説明させていただきます...',
            '勤務開始日につきまして、ご都合をお聞かせください...',
            '施設見学のご希望、承知いたしました。以下の日程で...',
            'ご質問いただいた内容について、回答させていただきます...',
            'スカウトメッセージをご覧いただき、ありがとうございます...'
        ];
        
        // 求人タイトルのサンプルデータ
        const jobTitles = [
            '消化器内科医師（常勤）',
            '整形外科医師募集',
            '循環器内科医師（週3日〜）',
            '外科医師（スポット）',
            '内科医師募集',
            '小児科医師（常勤）',
            '皮膚科医師募集',
            '眼科医師（非常勤）',
            '耳鼻咽喉科医師',
            '精神科医師募集',
            '麻酔科医師（常勤）',
            '救急科医師募集'
        ];
        
        facilities.forEach((facility, index) => {
            const hoursAgo = index * 3;
            const messageDate = new Date();
            messageDate.setHours(messageDate.getHours() - hoursAgo);
            
            messages.push({
                id: index + 1,
                facility: facility,
                facilityInitial: facility.charAt(0),
                subject: subjects[index],
                preview: previews[index],
                timestamp: messageDate,
                isUnread: index < 4, // 最初の4件を未読に
                relatedJob: jobTitles[index],
                hasAttachment: index % 3 === 0
            });
        });
        
        let currentFilter = 'all';
        
        // メッセージ一覧の表示
        function displayMessages(filteredMessages = messages) {
            const container = document.getElementById('messagesList');
            container.innerHTML = '';
            
            if (filteredMessages.length === 0) {
                container.innerHTML = `
                    <div style="padding: var(--spacing-xl); text-align: center; color: var(--text-muted);">
                        メッセージが見つかりませんでした
                    </div>
                `;
                return;
            }
            
            filteredMessages.forEach(message => {
                const item = document.createElement('div');
                item.className = `message-item ${message.isUnread ? 'unread' : ''}`;
                item.onclick = () => openMessage(message.id);
                
                item.innerHTML = `
                    <div class="message-avatar">${message.facilityInitial}</div>
                    <div class="message-item-content">
                        <div class="message-item-header">
                            <div class="message-item-facility">${message.facility}</div>
                            <div class="message-item-time">${getTimeAgo(message.timestamp)}</div>
                        </div>
                        <div class="message-item-subject">${message.subject}</div>
                        <div class="message-item-preview">${message.preview}</div>
                        <div class="message-item-meta">
                            <span class="badge badge-outline" style="font-size: var(--font-size-xs);">
                                ${message.relatedJob}
                            </span>
                            ${message.hasAttachment ? `
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted);">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                </svg>
                            ` : ''}
                        </div>
                    </div>
                    ${message.isUnread ? '<div class="unread-indicator"></div>' : ''}
                `;
                
                container.appendChild(item);
            });
        }
        
        // メッセージフィルター
        function filterMessages(filter) {
            currentFilter = filter;
            
            // タブのアクティブ状態を更新
            document.querySelectorAll('.messages-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.messages-tab').classList.add('active');
            
            applyFilters();
        }
        
        // 検索
        function searchMessages() {
            applyFilters();
        }
        
        // フィルター適用
        function applyFilters() {
            let filtered = [...messages];
            
            // ステータスフィルター
            if (currentFilter === 'unread') {
                filtered = filtered.filter(m => m.isUnread);
            }
            
            // 検索フィルター
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(m =>
                    m.facility.toLowerCase().includes(searchQuery) ||
                    m.subject.toLowerCase().includes(searchQuery) ||
                    m.preview.toLowerCase().includes(searchQuery)
                );
            }
            
            displayMessages(filtered);
        }
        
        // カウント更新
        function updateCounts() {
            document.getElementById('countAll').textContent = messages.length;
            document.getElementById('countUnread').textContent = messages.filter(m => m.isUnread).length;
        }
        
        // メッセージを開く
        function openMessage(messageId) {
            // メッセージスレッド画面へ遷移
            window.location.href = `doctor-message-thread.html?id=${messageId}`;
        }
        
        // 初期化
        updateCounts();
        displayMessages();
    </script>
</body>
