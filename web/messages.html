<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ - MediMatch 医療機関向け</title>
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="web-style.css">
    <style>
        .messages-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 0;
            height: calc(100vh - 140px);
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
        }
        
        .messages-sidebar {
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-white);
        }
        
        .messages-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }
        
        .messages-header h2 {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }
        
        .messages-tabs {
            display: flex;
            gap: var(--spacing-xs);
        }
        
        .message-tab {
            flex: 1;
            padding: var(--spacing-sm) var(--spacing-md);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            transition: all 0.2s ease;
            font-weight: 500;
            text-align: center;
        }
        
        .message-tab:hover {
            color: var(--primary-blue);
            background-color: var(--gray-50);
        }
        
        .message-tab.active {
            color: var(--primary-blue);
            border-bottom-color: var(--primary-blue);
        }
        
        .messages-search {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }
        
        .messages-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .message-item {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            gap: var(--spacing-md);
            align-items: flex-start;
        }
        
        .message-item:hover {
            background-color: var(--gray-50);
        }
        
        .message-item.active {
            background-color: var(--primary-blue-light);
            border-left: 4px solid var(--primary-blue);
        }
        
        .message-item.unread {
            background-color: #f0f7ff;
        }
        
        .message-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .message-content {
            flex: 1;
            min-width: 0;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: var(--spacing-xs);
        }
        
        .message-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .message-item.unread .message-name {
            font-weight: 700;
        }
        
        .message-time {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            white-space: nowrap;
        }
        
        .message-subject {
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .message-preview {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .message-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            margin-top: var(--spacing-xs);
        }
        
        .messages-main {
            display: flex;
            flex-direction: column;
            background-color: var(--gray-50);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: var(--spacing-4xl);
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: var(--spacing-lg);
            opacity: 0.3;
        }
        
        .empty-state-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        .empty-state-text {
            color: var(--text-muted);
        }
        
        @media (max-width: 1024px) {
            .messages-layout {
                grid-template-columns: 1fr;
            }
            
            .messages-sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            
            .messages-main {
                display: none;
            }
            
            .messages-main.show-mobile {
                display: flex;
            }
        }
    </style>
</head>
<body>

                <!-- メッセージレイアウト -->

                    <!-- サイドバー（メッセージリスト） -->

                        <div class="messages-header">
                            <h2>メッセージ</h2>
                            <div class="messages-tabs">
                                <button class="message-tab active" onclick="filterMessages('all')">

                                </button>
                                <button class="message-tab" onclick="filterMessages('unread')">

    <script src="../common/demo-data.js"></script>
    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = 'login.html';
        }
        
        const userName = sessionStorage.getItem('userName');
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }
        
        // メニュートグル
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });
        
        // メッセージデータの生成
        const messages = [];
        
        const subjects = [
            '応募に関するご質問',
            'スカウトへの返信',
            '面接日程のご相談',
            '求人内容の確認',
            '勤務条件について',
            '履歴書の提出について',
            '面接のお礼',
            '内定のご連絡',
            '入職日の調整',
            '契約内容の確認'
        ];
        
        const previews = [
            'ご連絡ありがとうございます。面接日程について、来週の火曜日14時以降でしたら...',
            '貴院の求人に大変興味があります。詳細についてお話を伺えればと思います...',
            '先日はお時間をいただきありがとうございました。面接の結果についてご連絡...',
            '求人内容について、いくつかご質問させていただきたく存じます...',
            '当直の頻度や勤務時間について、もう少し詳しく教えていただけますでしょうか...',
            '履歴書と職務経歴書を添付いたしました。ご確認いただけますと幸いです...',
            '本日は貴重なお時間をありがとうございました。面接でのお話を通して...',
            'この度は内定のご連絡をいただき、誠にありがとうございます...',
            '入職日について、4月1日からでよろしいでしょうか。ご確認お願いいたします...',
            '契約書の内容を確認いたしました。いくつか質問がございます...'
        ];
        
        // デモメッセージデータを生成（15件）
        DEMO_DOCTORS.slice(0, 15).forEach((doctor, index) => {
            const hoursAgo = index * 3; // メッセージ時刻（何時間前）
            const messageDate = new Date();
            messageDate.setHours(messageDate.getHours() - hoursAgo);
            
            const isUnread = index < 3; // 最初の3件を未読にする
            
            messages.push({
                id: index + 1,
                doctor: doctor,
                subject: subjects[index % subjects.length],
                preview: previews[index % previews.length],
                lastMessageDate: messageDate,
                unread: isUnread,
                messageCount: Math.floor(Math.random() * 10) + 1,
                relatedTo: index % 2 === 0 ? 'application' : 'scout'
            });
        });
        
        let currentFilter = 'all';
        let selectedMessageId = null;
        
        // メッセージ一覧の表示
        function displayMessages(filteredMessages = messages) {
            const container = document.getElementById('messagesList');
            container.innerHTML = '';
            
            if (filteredMessages.length === 0) {
                container.innerHTML = `
                    <div style="padding: var(--spacing-xl); text-align: center; color: var(--text-muted);">
                        メッセージが見つかりませんでした
                    </div>
                `;
                return;
            }
            
            filteredMessages.forEach(msg => {
                const item = document.createElement('div');
                item.className = `message-item ${msg.unread ? 'unread' : ''} ${selectedMessageId === msg.id ? 'active' : ''}`;
                item.onclick = () => selectMessage(msg.id);
                
                const timeAgo = getTimeAgo(msg.lastMessageDate);
                const relatedIcon = msg.relatedTo === 'application' ? '📋' : '📧';
                
                item.innerHTML = `
                    <div class="message-avatar">${msg.doctor.name.substring(0, 1)}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <div class="message-name">${msg.doctor.name}</div>
                            <div class="message-time">${timeAgo}</div>
                        </div>
                        <div class="message-subject">${msg.subject}</div>
                        <div class="message-preview">${msg.preview}</div>
                        <div class="message-badge">
                            <span style="font-size: var(--font-size-xs);">${relatedIcon} ${msg.relatedTo === 'application' ? '応募' : 'スカウト'}</span>
                            ${msg.unread ? '<span class="badge badge-error" style="font-size: var(--font-size-xs);">未読</span>' : ''}
                        </div>
                    </div>
                `;
                
                container.appendChild(item);
            });
        }
        
        // 時間差を表示形式に変換
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'たった今';
            if (diffMins < 60) return `${diffMins}分前`;
            if (diffHours < 24) return `${diffHours}時間前`;
            if (diffDays < 7) return `${diffDays}日前`;
            
            return formatDate(date);
        }
        
        // メッセージ選択
        function selectMessage(messageId) {
            selectedMessageId = messageId;
            const message = messages.find(m => m.id === messageId);
            
            if (message) {
                // 未読を既読にする
                message.unread = false;
                
                // メッセージスレッド画面へ遷移
                window.location.href = `message-thread.html?id=${messageId}`;
            }
        }
        
        // フィルター
        function filterMessages(filter) {
            currentFilter = filter;
            
            // タブのアクティブ状態を更新
            document.querySelectorAll('.message-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.message-tab').classList.add('active');
            
            applyFilters();
        }
        
        // 検索
        function searchMessages() {
            applyFilters();
        }
        
        // フィルター適用
        function applyFilters() {
            let filtered = [...messages];
            
            // ステータスフィルター
            if (currentFilter === 'unread') {
                filtered = filtered.filter(msg => msg.unread);
            }
            
            // 検索フィルター
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(msg => 
                    msg.doctor.name.toLowerCase().includes(searchQuery) ||
                    msg.subject.toLowerCase().includes(searchQuery) ||
                    msg.preview.toLowerCase().includes(searchQuery)
                );
            }
            
            // 日時順にソート（新しい順）
            filtered.sort((a, b) => b.lastMessageDate - a.lastMessageDate);
            
            displayMessages(filtered);
        }
        
        // 初期化
        displayMessages();
    </script>
</body>
