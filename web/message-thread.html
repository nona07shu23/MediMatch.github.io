<head>
    <meta charset="UTF-8">

    <style>
        .thread-layout {
            display: grid;
            grid-template-columns: 350px 1fr 300px;
            gap: 0;
            height: calc(100vh - 140px);
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
        }
        
        .thread-sidebar {
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-white);
        }
        
        .thread-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }
        
        .thread-header h2 {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }
        
        .message-item {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            gap: var(--spacing-md);
            align-items: flex-start;
        }
        
        .message-item:hover {
            background-color: var(--gray-50);
        }
        
        .message-item.active {
            background-color: #f0f7ff;
            border-left: 4px solid var(--primary-blue);
        }
        
        .message-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .messages-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .thread-main {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-white);
        }
        
        .thread-top-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            background-color: var(--bg-white);
        }
        
        .thread-doctor-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }
        
        .thread-doctor-info {
            flex: 1;
        }
        
        .thread-doctor-name {
            font-size: var(--font-size-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }
        
        .thread-doctor-specialty {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }
        
        .thread-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl);
            background-color: var(--gray-50);
        }
        
        .chat-message {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .chat-message.sent {
            flex-direction: row-reverse;
        }
        
        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .chat-message.sent .chat-avatar {
            background: linear-gradient(135deg, var(--success), var(--info));
        }
        
        .chat-content {
            max-width: 65%;
        }
        
        .chat-bubble {
            background-color: white;
            padding: var(--spacing-md);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-xs);
        }
        
        .chat-message.sent .chat-bubble {
            background-color: var(--primary-blue);
            color: white;
        }
        
        .chat-text {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .chat-meta {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            padding: 0 var(--spacing-sm);
        }
        
        .chat-message.sent .chat-meta {
            text-align: right;
        }
        
        .thread-input-area {
            padding: var(--spacing-lg);
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-white);
        }
        
        .input-toolbar {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
        }
        
        .toolbar-btn {
            padding: var(--spacing-sm);
            background: none;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }
        
        .toolbar-btn:hover {
            background-color: var(--gray-50);
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }
        
        .message-input-wrapper {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .message-input {
            flex: 1;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            resize: none;
            font-family: inherit;
            font-size: var(--font-size-base);
            min-height: 80px;
        }
        
        .message-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px var(--primary-blue-light);
        }
        
        .thread-sidebar-right {
            border-left: 1px solid var(--border-color);
            padding: var(--spacing-lg);
            overflow-y: auto;
            background-color: var(--bg-white);
        }
        
        .sidebar-section {
            margin-bottom: var(--spacing-xl);
        }
        
        .sidebar-section-title {
            font-size: var(--font-size-base);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }
        
        .info-card {
            background-color: var(--gray-50);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
        }
        
        .info-card-title {
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
        }
        
        .info-card-text {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
        }
        
        .quick-action-btn {
            width: 100%;
            margin-bottom: var(--spacing-sm);
        }
        
        @media (max-width: 1200px) {
            .thread-layout {
                grid-template-columns: 300px 1fr;
            }
            
            .thread-sidebar-right {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .thread-layout {
                grid-template-columns: 1fr;
            }
            
            .thread-sidebar {
                display: none;
            }
            
            .chat-content {
                max-width: 80%;
            }
        }
    </style>
</head>

        }
        
        const userName = sessionStorage.getItem('userName');
        if (userName) {

        const job = DEMO_JOBS[0];
        
        // 医師情報を表示
        function displayDoctorInfo() {
            document.getElementById('breadcrumbDoctor').textContent = doctor.name;
            document.getElementById('doctorAvatar').textContent = doctor.name.substring(0, 1);
            document.getElementById('doctorName').textContent = doctor.name;
            document.getElementById('doctorSpecialty').textContent = `${doctor.specialty} / ${doctor.subSpecialty}`;
            document.getElementById('relatedJob').textContent = job.title;
            document.getElementById('doctorExperience').textContent = `${doctor.experience}年`;
            document.getElementById('doctorSubSpecialty').textContent = doctor.subSpecialty;
            document.getElementById('doctorLocation').textContent = doctor.preferredLocations[0];
        }
        
        // 会話データを生成
        const chatMessages = [
            {
                sender: 'doctor',
                text: 'こんにちは。先日スカウトをいただきました佐藤と申します。\n貴院の求人に大変興味があります。',
                time: new Date(Date.now() - 3600000 * 24 * 2) // 2日前
            },
            {
                sender: 'facility',
                text: '佐藤先生、ご連絡ありがとうございます。\n当院の求人にご興味をお持ちいただき、嬉しく思います。\n\nまずは一度面接の機会を設けさせていただけますでしょうか？',
                time: new Date(Date.now() - 3600000 * 24 * 2 + 3600000) // 2日前+1時間
            },
            {
                sender: 'doctor',
                text: 'ありがとうございます。ぜひお願いいたします。\n\n来週でしたら、火曜日の14時以降か、木曜日の午前中でしたら都合がつきます。いかがでしょうか？',
                time: new Date(Date.now() - 3600000 * 24 + 3600000 * 2) // 1日前+2時間
            },
            {
                sender: 'facility',
                text: 'ご希望をお伝えいただきありがとうございます。\n\n来週火曜日の14時30分から、当院にて面接を実施させていただければと存じます。\n所要時間は1時間程度を予定しております。\n\nご都合はいかがでしょうか？',
                time: new Date(Date.now() - 3600000 * 18) // 18時間前
            },
            {
                sender: 'doctor',
                text: '火曜日14時30分で問題ございません。\nよろしくお願いいたします。\n\n当日の持ち物や、事前に準備しておくことはございますか？',
                time: new Date(Date.now() - 3600000 * 12) // 12時間前
            }
        ];
        
        // メッセージスレッドを表示
        function displayThread() {
            const container = document.getElementById('threadMessages');
            container.innerHTML = '';
            
            chatMessages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `chat-message ${msg.sender === 'facility' ? 'sent' : ''}`;
                
                const avatarLetter = msg.sender === 'facility' ? userName.substring(0, 1) : doctor.name.substring(0, 1);
                const timeStr = formatDateTime(msg.time);
                
                messageDiv.innerHTML = `
                    <div class="chat-avatar">${avatarLetter}</div>
                    <div class="chat-content">
                        <div class="chat-bubble">
                            <div class="chat-text">${msg.text}</div>
                        </div>
                        <div class="chat-meta">${timeStr}</div>
                    </div>
                `;
                
                container.appendChild(messageDiv);
            });
            
            // スクロールを最下部に
            container.scrollTop = container.scrollHeight;
        }
        
        // 日時フォーマット
        function formatDateTime(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'たった今';
            if (diffMins < 60) return `${diffMins}分前`;
            if (diffHours < 24) return `${diffHours}時間前`;
            if (diffDays < 7) {
                const hours = date.getHours();
                const mins = String(date.getMinutes()).padStart(2, '0');
                return `${diffDays}日前 ${hours}:${mins}`;
            }
            
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hours = date.getHours();
            const mins = String(date.getMinutes()).padStart(2, '0');
            return `${month}月${day}日 ${hours}:${mins}`;
        }
        
        // メッセージ送信
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (text === '') {
                alert('メッセージを入力してください。');
                return;
            }
            
            // メッセージを追加
            chatMessages.push({
                sender: 'facility',
                text: text,
                time: new Date()
            });
            
            // 表示を更新
            displayThread();
            
            // 入力をクリア
            input.value = '';
            
            // 成功メッセージ
            // alert('✅ メッセージを送信しました。');
        }
        
        // Enterキーで送信（Shift+Enterで改行）
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        // ファイル添付
        function attachFile() {
            alert('📎 ファイル添付機能\n\n履歴書や資料を添付できます。\n（デモ機能）');
        }
        
        // テンプレート使用
        function useTemplate() {
            const templates = [
                '面接日程のご提案をさせていただきます。',
                'ご質問ありがとうございます。詳細をご説明いたします。',
                '選考結果についてご連絡させていただきます。'
            ];
            
            const template = templates[Math.floor(Math.random() * templates.length)];
            document.getElementById('messageInput').value = template;
        }
        
        // 面接日程調整
        function scheduleInterview() {
            alert('📅 面接日程調整\n\n候補日を提案して医師と調整できます。\n（別途実装予定）');
        }
        
        // 応募詳細
        function viewApplication() {
            window.location.href = 'application-detail.html';
        }
        
        // プロフィール表示
        function viewDoctorProfile() {
            window.location.href = 'doctor-detail.html';
        }
        
        // 左サイドバーのメッセージリスト表示（簡易版）
        function displayMessagesList() {
            const container = document.getElementById('messagesList');
            const doctors = DEMO_DOCTORS.slice(0, 5);
            
            doctors.forEach((doc, index) => {
                const item = document.createElement('div');
                item.className = `message-item ${index === 0 ? 'active' : ''}`;
                item.onclick = () => {
                    alert(`${doc.name}さんとのメッセージスレッドを開きます。`);
                };
                
                item.innerHTML = `
                    <div class="message-avatar">${doc.name.substring(0, 1)}</div>
                    <div style="flex: 1; min-width: 0;">
                        <div style="font-weight: 600; margin-bottom: 4px;">${doc.name}</div>
                        <div style="font-size: var(--font-size-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${index === 0 ? '当日の持ち物や、事前に準備して...' : 'メッセージのプレビューテキスト...'}
                        </div>
                    </div>
                `;
                
                container.appendChild(item);
            });
        }
        
        // 初期化
        displayDoctorInfo();
        displayThread();
        displayMessagesList();
    </script>
</body>
</html>
