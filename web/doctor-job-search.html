<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求人検索 - MediMatch 医師用</title>
    <link rel="stylesheet" href="../common/common.css">
    <link rel="stylesheet" href="web-style.css">
    <style>
        .job-card {
            background-color: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            transition: all var(--transition-base);
            cursor: pointer;
        }
        
        .job-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-blue);
        }
        
        .job-card-header {
            display: flex;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }
        
        .job-match-score {
            width: 80px;
            height: 80px;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .match-value {
            font-size: var(--font-size-2xl);
        }
        
        .match-label {
            font-size: var(--font-size-xs);
            opacity: 0.9;
        }
        
        .job-card-info {
            flex: 1;
        }
        
        .job-card-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }
        
        .job-card-facility {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
        }
        
        .job-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-xs);
            margin-top: var(--spacing-md);
        }
        
        .job-card-salary {
            background-color: var(--light-blue-bg);
            padding: var(--spacing-md);
            border-radius: var(--border-radius-md);
            margin-top: var(--spacing-md);
        }
        
        .salary-label {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            margin-bottom: var(--spacing-xs);
        }
        
        .salary-value {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--primary-blue);
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">メインコンテンツへスキップ</a>
    
    <div class="web-container">
        <!-- サイドバー -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="doctor-home.html" class="logo">
                    <div class="logo-icon">M</div>
                    <span class="logo-text">MediMatch</span>
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <a href="doctor-home.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>ホーム</span>
                </a>
                
                <a href="doctor-job-search.html" class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span>求人検索</span>
                </a>
                
                <a href="doctor-scouts.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span>スカウト</span>
                    <span class="badge badge-error" style="margin-left: auto;">8</span>
                </a>
                
                <a href="doctor-applications.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>応募管理</span>
                </a>
                
                <a href="doctor-messages.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>メッセージ</span>
                    <span class="badge badge-error" style="margin-left: auto;">2</span>
                </a>
                
                <a href="doctor-calendar.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>カレンダー</span>
                </a>
                
                <a href="doctor-profile.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>プロフィール</span>
                </a>
                
                <a href="doctor-settings.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span>設定</span>
                </a>
            </nav>
        </aside>
        
        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- ヘッダー -->
            <header class="top-header">
                <div class="header-left">
                    <button class="btn btn-outline btn-sm" id="menuToggle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <h1 class="page-title">求人検索</h1>
                </div>
                
                <div class="header-right">
                    <div class="notification-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-badge">5</span>
                    </div>
                    
                    <div class="user-menu">
                        <div class="user-menu-button">
                            <div class="user-avatar">山</div>
                            <span id="userName">山田太郎医師</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-menu-header">
                                <div class="dropdown-menu-user-name">山田太郎医師</div>
                                <div class="dropdown-menu-user-email">doctor@demo.medimatch.jp</div>
                            </div>
                            <div class="dropdown-menu-body">
                                <a href="settings.html" class="dropdown-menu-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                    <span>アカウント設定</span>
                                </a>
                                <a href="settings.html" class="dropdown-menu-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path d="M12 1v6m0 6v6m5.196-11.196l-4.243 4.243M7.757 16.243l-4.243 4.243m11.314-4.243l4.243 4.243M7.757 7.757l-4.243-4.243"></path>
                                    </svg>
                                    <span>設定</span>
                                </a>
                                <div class="dropdown-menu-divider"></div>
                                <a href="#" class="dropdown-menu-item danger" onclick="event.preventDefault(); signOut();">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                        <polyline points="16 17 21 12 16 7"></polyline>
                                        <line x1="21" y1="12" x2="9" y2="12"></line>
                                    </svg>
                                    <span>サインアウト</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- コンテンツエリア -->
            <div class="content-area" id="main-content">
                <div class="content-header">
                    <div class="breadcrumb">
                        <a href="doctor-home.html">ホーム</a>
                        <span class="breadcrumb-separator">›</span>
                        <span>求人検索</span>
                    </div>
                    
                    <div class="content-header-top">
                        <div>
                            <h2 class="mb-xs">求人検索</h2>
                            <p class="text-muted mb-0">あなたに合った求人を見つけましょう</p>
                        </div>
                    </div>
                </div>
                
                <!-- 検索フィルター -->
                <div class="search-filters">
                    <div class="filter-row">
                        <div class="search-box">
                            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <input type="text" class="form-control" placeholder="キーワードで検索" id="searchInput" oninput="filterJobs()">
                        </div>
                        
                        <select class="form-control" id="specialtyFilter" onchange="filterJobs()">
                            <option value="">すべての診療科</option>
                        </select>
                        
                        <select class="form-control" id="employmentTypeFilter" onchange="filterJobs()">
                            <option value="">すべての雇用形態</option>
                            <option value="常勤">常勤</option>
                            <option value="非常勤">非常勤</option>
                            <option value="スポット">スポット</option>
                        </select>
                        
                        <select class="form-control" id="prefectureFilter" onchange="filterJobs()">
                            <option value="">すべての地域</option>
                        </select>
                    </div>
                    
                    <div class="filter-row">
                        <div class="form-check">
                            <input type="checkbox" id="onCallFilter" onchange="filterJobs()">
                            <label for="onCallFilter">当直なしのみ</label>
                        </div>
                        
                        <button class="btn btn-outline" onclick="resetFilters()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="1 4 1 10 7 10"></polyline>
                                <polyline points="23 20 23 14 17 14"></polyline>
                                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                            </svg>
                            リセット
                        </button>
                        
                        <select class="form-control" style="width: auto; margin-left: auto;" id="sortBy" onchange="filterJobs()">
                            <option value="match">マッチ度順</option>
                            <option value="salary">給与順</option>
                            <option value="new">新着順</option>
                        </select>
                    </div>
                </div>
                
                <!-- 検索結果 -->
                <div class="mb-lg">
                    <div class="d-flex justify-content-between align-items-center mb-md">
                        <div>
                            <span class="fw-semibold" id="resultCount">20</span> 件の求人が見つかりました
                        </div>
                    </div>
                    
                    <div id="jobList">
                        <!-- JavaScriptで動的に生成 -->
                    </div>
                </div>
                
                <!-- ページネーション -->
                <div class="pagination">
                    <button class="pagination-btn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button class="pagination-btn active">1</button>
                    <button class="pagination-btn">2</button>
                    <button class="pagination-btn">3</button>
                    <button class="pagination-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../common/demo-data.js"></script>
    <script>
        // ログイン確認
        if (!sessionStorage.getItem('isLoggedIn') || sessionStorage.getItem('userType') !== 'doctor') {
            window.location.href = 'login.html';
        }
        
        const userName = sessionStorage.getItem('userName');
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }
        
        // メニュートグル
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });
        
        // フィルターの初期化
        function initFilters() {
            const specialtyFilter = document.getElementById('specialtyFilter');
            SPECIALTIES.forEach(specialty => {
                const option = document.createElement('option');
                option.value = specialty;
                option.textContent = specialty;
                specialtyFilter.appendChild(option);
            });
            
            const prefectureFilter = document.getElementById('prefectureFilter');
            PREFECTURES.forEach(pref => {
                const option = document.createElement('option');
                option.value = pref;
                option.textContent = pref;
                prefectureFilter.appendChild(option);
            });
        }
        
        // 求人カード表示
        function displayJobs(jobs = DEMO_JOBS) {
            const container = document.getElementById('jobList');
            container.innerHTML = '';
            
            document.getElementById('resultCount').textContent = jobs.length;
            
            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        <div class="empty-title">求人が見つかりませんでした</div>
                        <div class="empty-description">条件を変更して再度検索してください</div>
                    </div>
                `;
                return;
            }
            
            jobs.forEach(job => {
                const matchScore = Math.floor(Math.random() * 20) + 80; // 80-100のランダムスコア
                
                const card = document.createElement('div');
                card.className = 'job-card';
                card.onclick = () => location.href = 'doctor-job-detail.html?id=' + job.id;
                card.innerHTML = `
                    <div class="job-card-header">
                        <div class="job-match-score">
                            <div class="match-value">${matchScore}%</div>
                            <div class="match-label">マッチ度</div>
                        </div>
                        <div class="job-card-info">
                            <div class="job-card-title">${job.title}</div>
                            <div class="job-card-facility">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                </svg>
                                ${job.facilityName}
                            </div>
                            <div class="job-card-facility">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                    <circle cx="12" cy="10" r="3"></circle>
                                </svg>
                                ${job.location}
                            </div>
                            <div class="job-card-badges">
                                <span class="badge badge-primary">${job.specialty}</span>
                                <span class="badge badge-gray">${job.employmentType}</span>
                                ${job.onCallRequired ? '<span class="badge badge-warning">当直あり</span>' : '<span class="badge badge-success">当直なし</span>'}
                                <span class="badge badge-info">新着</span>
                            </div>
                        </div>
                    </div>
                    <div class="job-card-salary">
                        <div class="salary-label">提示給与</div>
                        <div class="salary-value">${formatSalary(job.salaryType, job.salaryMin, job.salaryMax)}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        // フィルタリング
        function filterJobs() {
            const query = document.getElementById('searchInput').value;
            const specialty = document.getElementById('specialtyFilter').value;
            const employmentType = document.getElementById('employmentTypeFilter').value;
            const prefecture = document.getElementById('prefectureFilter').value;
            const onCallFilter = document.getElementById('onCallFilter').checked;
            
            let results = [...DEMO_JOBS];
            
            if (specialty) {
                results = results.filter(job => job.specialty === specialty);
            }
            
            if (employmentType) {
                results = results.filter(job => job.employmentType === employmentType);
            }
            
            if (prefecture) {
                results = results.filter(job => job.prefecture === prefecture);
            }
            
            if (onCallFilter) {
                results = results.filter(job => !job.onCallRequired);
            }
            
            if (query) {
                const q = query.toLowerCase();
                results = results.filter(job => 
                    job.title.toLowerCase().includes(q) ||
                    job.facilityName.toLowerCase().includes(q) ||
                    job.description.toLowerCase().includes(q)
                );
            }
            
            displayJobs(results);
        }
        
        // フィルターリセット
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('specialtyFilter').value = '';
            document.getElementById('employmentTypeFilter').value = '';
            document.getElementById('prefectureFilter').value = '';
            document.getElementById('onCallFilter').checked = false;
            displayJobs();
        }
        
        // 初期化
        initFilters();
        displayJobs();
    </script>
</body>
</html>
